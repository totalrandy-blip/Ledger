<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ledger — daily calorie tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root{
    --bg: #15140F;
    --surface: #1E1D16;
    --surface-2: #262419;
    --line: #34321F;
    --text: #EDEAE0;
    --text-muted: #8B887C;
    --good: #8CA37E;
    --over: #C07356;
    --accent: #D8C892;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  #app{ max-width: 480px; margin: 0 auto; padding: 24px 20px 100px; }

  /* header / date nav */
  .datebar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom: 28px;
  }
  .datebar button{
    background:none; border:none; color:var(--text-muted);
    font-size: 20px; padding: 6px 10px; cursor:pointer; border-radius:6px;
  }
  .datebar button:hover{ color: var(--text); background: var(--surface); }
  .datebar .label{ font-size:13px; color:var(--text-muted); letter-spacing:0.02em; }

  /* hero */
  .hero{ text-align:center; margin-bottom: 22px; }
  .hero .balance{
    font-family:'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 64px;
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .hero .balance.over{ color: var(--over); }
  .hero .balance .unit{ font-size: 22px; color: var(--text-muted); font-family:'IBM Plex Sans',sans-serif; margin-left:6px; }
  .hero .sub{ margin-top:8px; font-size:14px; color:var(--text-muted); }
  .hero .sub button{
    background:none; border:none; color:var(--text-muted); text-decoration:underline;
    text-underline-offset:3px; cursor:pointer; font-size:14px; font-family:inherit; padding:0;
  }
  .hero .sub button:hover{ color: var(--text); }

  .bar{
    height:6px; border-radius:3px; background: var(--surface-2);
    margin: 18px 0 4px; overflow:hidden; position:relative;
  }
  .bar-fill{ height:100%; background: var(--good); border-radius:3px; transition: width 0.4s ease; }
  .bar-fill.over{ background: var(--over); }
  .bar-caption{ display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted); }

  /* add entry */
  .addbox{
    background: var(--surface); border:1px solid var(--line); border-radius:10px;
    padding: 14px; margin: 26px 0 18px;
  }
  .addbox .row{ display:flex; gap:8px; }
  .addbox input[type=text]{
    flex:1; background: var(--surface-2); border:1px solid var(--line); border-radius:7px;
    color: var(--text); padding: 10px 12px; font-size:15px; font-family:inherit;
  }
  .addbox input[type=text]:focus{ outline:none; border-color: var(--accent); }
  .addbox .searchbtn{
    background: var(--surface-2); border:1px solid var(--line); border-radius:7px;
    color: var(--text-muted); padding: 0 14px; font-size:14px; cursor:pointer;
  }
  .toggle-manual{
    display:block; margin-top:10px; background:none; border:none; color:var(--text-muted);
    font-size:13px; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:0;
  }
  .manual-row{ display:flex; gap:8px; margin-top:10px; }
  .manual-row input{
    background: var(--surface-2); border:1px solid var(--line); border-radius:7px;
    color: var(--text); padding: 10px 12px; font-size:15px; font-family:inherit;
  }
  .manual-row input.name{ flex:2; }
  .manual-row input.kcal{ flex:1; min-width:0; }
  .manual-row input.portions{ flex:0 0 78px; min-width:0; }
  .manual-row button{
    background: var(--accent); border:none; border-radius:7px; color:#1A1808;
    padding: 0 16px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .field-label{ font-size:10px; color:var(--text-muted); margin-bottom:3px; display:block; }

  .portion-picker{
    background: var(--surface-2); border:1px solid var(--line); border-radius:8px;
    padding: 12px; margin-top: 8px; display:none; flex-direction:column; gap:10px;
  }
  .portion-picker .ppname{ font-size:14px; }
  .portion-picker .ppbase{ font-size:12px; color:var(--text-muted); }
  .portion-picker .quick{ display:flex; gap:6px; flex-wrap:wrap; }
  .portion-picker .quick button{
    background: var(--surface); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:6px 10px; font-size:13px; cursor:pointer;
  }
  .portion-picker .quick button.active{ border-color: var(--accent); color: var(--accent); }
  .portion-picker .customrow{ display:flex; gap:8px; align-items:center; }
  .portion-picker .customrow input{
    width:70px; background: var(--surface); border:1px solid var(--line); border-radius:6px;
    color: var(--text); padding:8px; font-size:14px; font-family:inherit;
  }
  .portion-picker .customrow button{
    background: var(--accent); border:none; border-radius:6px; color:#1A1808;
    padding: 8px 16px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .portion-picker .cancel{
    background:none; border:none; color:var(--text-muted); font-size:12px;
    text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:0; align-self:flex-start;
  }

  .results{ margin-top:10px; display:flex; flex-direction:column; gap:6px; max-height:240px; overflow-y:auto; }
  .result{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background: var(--surface-2); border-radius:7px; padding: 9px 12px; cursor:pointer;
  }
  .result:hover{ background: #2C2A1D; }
  .result .rname{ font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .result .rkcal{ font-size:13px; color:var(--text-muted); white-space:nowrap; }
  .searching{ font-size:13px; color:var(--text-muted); margin-top:8px; }

  /* log */
  .log-heading{ font-size:13px; color:var(--text-muted); margin: 24px 0 10px; letter-spacing:0.02em; }
  .entry{
    display:flex; justify-content:space-between; align-items:center;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .entry .ename{ font-size:15px; cursor:pointer; }
  .entry .ename:hover{ text-decoration: underline; text-underline-offset:3px; color: var(--accent); }
  .entry .emeta{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .entry .eright{ display:flex; align-items:center; gap:12px; }
  .entry .ekcal{ font-size:15px; color:var(--text); font-variant-numeric: tabular-nums; }
  .entry .edel{
    background:none; border:none; color:var(--text-muted); font-size:18px; cursor:pointer;
    padding:2px 6px; line-height:1;
  }
  .entry .edel:hover{ color: var(--over); }

  .empty{
    text-align:center; color:var(--text-muted); font-size:14px; padding: 30px 10px;
    border: 1px dashed var(--line); border-radius:10px; margin-top:16px;
  }

  .goal-edit{
    display:flex; gap:8px; align-items:center; justify-content:center; margin-top:10px;
  }
  .goal-edit input{
    width:80px; text-align:center; background: var(--surface-2); border:1px solid var(--line);
    border-radius:7px; color:var(--text); padding:6px 8px; font-size:14px; font-family:inherit;
  }
  .goal-edit button{
    background: var(--accent); border:none; border-radius:7px; color:#1A1808;
    padding: 6px 12px; font-size:13px; font-weight:600; cursor:pointer;
  }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:3px; }
</style>
</head>
<body>
<div id="app">
  <div class="datebar">
    <button id="prevDay">&#8592;</button>
    <div class="label" id="dateLabel">Today</div>
    <button id="nextDay">&#8594;</button>
  </div>

  <div class="hero">
    <div class="balance" id="balanceNum">—</div>
    <div class="sub" id="heroSub"></div>
    <div class="bar"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
    <div class="bar-caption">
      <span id="consumedCaption">0 eaten</span>
      <button id="editGoalBtn">edit goal</button>
    </div>
    <div class="goal-edit" id="goalEdit" style="display:none;">
      <input type="number" id="goalInput" inputmode="numeric">
      <button id="saveGoalBtn">Save</button>
    </div>
  </div>

  <div class="addbox">
    <div class="row">
      <input type="text" id="searchInput" placeholder="Search a food, e.g. banana">
      <button class="searchbtn" id="searchBtn">Search</button>
    </div>
    <div class="results" id="results"></div>
    <div class="portion-picker" id="portionPicker"></div>
    <div class="searching" id="searching" style="display:none;">Searching…</div>
    <button class="toggle-manual" id="toggleManual">or enter manually</button>
    <div class="manual-row" id="manualRow" style="display:none;">
      <input type="text" class="name" id="manualName" placeholder="Food name">
      <input type="number" class="kcal" id="manualKcal" placeholder="kcal" inputmode="decimal">
      <input type="number" class="portions" id="manualPortions" placeholder="portions" value="1" step="0.25" inputmode="decimal">
      <button id="manualAdd">Add</button>
    </div>
  </div>

  <div class="log-heading" id="logHeading">Today's log</div>
  <div id="logList"></div>
</div>

<script>
let currentOffset = 0; // days from today, 0 = today
let goal = 2000;
let entries = [];
let goalLoaded = false;

function dateKeyFor(offset){
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0,10);
}

function formatDateLabel(offset){
  if(offset === 0) return 'Today';
  if(offset === -1) return 'Yesterday';
  if(offset === 1) return 'Tomorrow';
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}

async function loadGoal(){
  try{
    const res = await window.storage.get('settings', false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      goal = parsed.goal || 2000;
    }
  }catch(e){ /* no settings saved yet */ }
  goalLoaded = true;
}

async function saveGoal(newGoal){
  goal = newGoal;
  try{
    await window.storage.set('settings', JSON.stringify({ goal }), false);
  }catch(e){ console.error('save goal failed', e); }
}

async function loadEntries(){
  const key = 'log:' + dateKeyFor(currentOffset);
  try{
    const res = await window.storage.get(key, false);
    entries = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    entries = [];
  }
}

async function saveEntries(){
  const key = 'log:' + dateKeyFor(currentOffset);
  try{
    await window.storage.set(key, JSON.stringify(entries), false);
  }catch(e){ console.error('save entries failed', e); }
}

function render(){
  document.getElementById('dateLabel').textContent = formatDateLabel(currentOffset);
  document.getElementById('logHeading').textContent =
    (currentOffset === 0 ? "Today's" : formatDateLabel(currentOffset) + "'s") + " log";

  const total = entries.reduce((sum, e) => sum + e.calories, 0);
  const remaining = goal - total;
  const balanceEl = document.getElementById('balanceNum');
  const isOver = remaining < 0;

  balanceEl.innerHTML = (isOver ? '+' + Math.abs(remaining) : remaining) +
    '<span class="unit">' + (isOver ? 'over' : 'left') + '</span>';
  balanceEl.className = 'balance' + (isOver ? ' over' : '');

  const pct = Math.min(100, Math.round((total / goal) * 100));
  const fillEl = document.getElementById('barFill');
  fillEl.style.width = pct + '%';
  fillEl.className = 'bar-fill' + (isOver ? ' over' : '');

  document.getElementById('consumedCaption').textContent = total + ' eaten of ' + goal;

  const logList = document.getElementById('logList');
  if(entries.length === 0){
    logList.innerHTML = '<div class="empty">Nothing logged ' +
      (currentOffset === 0 ? 'today' : 'this day') + ' yet. Search or add a food above.</div>';
  } else {
    logList.innerHTML = entries.slice().reverse().map(e => `
      <div class="entry" data-id="${e.id}">
        <div>
          <div class="ename" data-id="${e.id}">${escapeHtml(e.name)}</div>
          ${e.servings && e.servings !== 1 ? `<div class="emeta">${e.servings} portion${e.servings === 1 ? '' : 's'} — tap to edit</div>` : `<div class="emeta">tap to edit portion</div>`}
        </div>
        <div class="eright">
          <div class="ekcal">${e.calories}</div>
          <button class="edel" data-id="${e.id}">&times;</button>
        </div>
      </div>
    `).join('');

    document.querySelectorAll('.ename').forEach(el => {
      el.addEventListener('click', () => editEntryPortion(el.getAttribute('data-id')));
    });

    document.querySelectorAll('.edel').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-id');
        entries = entries.filter(e => e.id !== id);
        await saveEntries();
        render();
      });
    });
  }
}

async function editEntryPortion(id){
  const entry = entries.find(e => e.id === id);
  if(!entry) return;
  const baseKcal = entry.kcalPerServing || (entry.calories / (entry.servings || 1));
  const val = prompt('Portions of "' + entry.name + '" (' + Math.round(baseKcal) + ' kcal per whole portion). Try 0.5 for half.', entry.servings || 1);
  if(val === null) return;
  const num = parseFloat(val);
  if(!isNaN(num) && num > 0){
    entry.kcalPerServing = baseKcal;
    entry.servings = num;
    entry.calories = Math.round(baseKcal * num);
    await saveEntries();
    render();
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function addEntry(name, kcalPerServing, servings){
  const s = servings || 1;
  entries.push({
    id: Date.now().toString() + Math.random().toString(36).slice(2,7),
    name, kcalPerServing: kcalPerServing, servings: s, calories: Math.round(kcalPerServing * s)
  });
  await saveEntries();
  render();
}

// search — chains multiple free food databases until one returns results.
// 1) USDA FoodData Central (DEMO_KEY works with no signup; swap in your own free key from
//    https://fdc.nal.usda.gov/api-key-signup.html if you hit rate limits)
// 2) Open Food Facts (backup — broader on branded/packaged products)
// If both come up empty, offers a Google search fallback.
const USDA_API_KEY = 'DEMO_KEY';
let currentResults = [];

function extractKcal(food){
  if(food.labelNutrients && food.labelNutrients.calories && typeof food.labelNutrients.calories.value === 'number'){
    return { kcal: food.labelNutrients.calories.value, perServing: true };
  }
  const energy = (food.foodNutrients || []).find(n =>
    (n.nutrientName === 'Energy' || n.nutrientNumber === '208') && (n.unitName === 'KCAL' || n.unitName === 'kcal')
  );
  if(energy && typeof energy.value === 'number'){
    return { kcal: energy.value, perServing: false };
  }
  return null;
}

async function searchUSDA(q){
  const url = 'https://api.nal.usda.gov/fdc/v1/foods/search?api_key=' + USDA_API_KEY +
    '&query=' + encodeURIComponent(q) + '&pageSize=12';
  const res = await fetch(url);
  if(!res.ok){ throw new Error('USDA HTTP ' + res.status); }
  const data = await res.json();
  return (data.foods || [])
    .map(f => {
      const info = extractKcal(f);
      if(!info) return null;
      return {
        name: f.description + (f.brandOwner ? ' — ' + f.brandOwner : ''),
        kcalPerServing: info.kcal,
        unitLabel: info.perServing ? 'per serving' : 'per 100g'
      };
    })
    .filter(Boolean);
}

async function searchOFF(q){
  const url = 'https://world.openfoodfacts.org/cgi/search.pl?search_terms=' +
    encodeURIComponent(q) + '&search_simple=1&action=process&json=1&page_size=12';
  const res = await fetch(url);
  if(!res.ok){ throw new Error('OFF HTTP ' + res.status); }
  const data = await res.json();
  return (data.products || [])
    .filter(p => p.product_name && p.nutriments && (p.nutriments['energy-kcal_100g'] || p.nutriments['energy-kcal_serving']))
    .map(p => {
      const perServing = p.nutriments['energy-kcal_serving'];
      const per100g = p.nutriments['energy-kcal_100g'];
      return {
        name: p.product_name + (p.brands ? ' — ' + p.brands.split(',')[0] : ''),
        kcalPerServing: perServing || per100g,
        unitLabel: perServing ? 'per serving' : 'per 100g'
      };
    });
}

async function doSearch(){
  const q = document.getElementById('searchInput').value.trim();
  const resultsEl = document.getElementById('results');
  const searchingEl = document.getElementById('searching');
  document.getElementById('portionPicker').style.display = 'none';
  resultsEl.innerHTML = '';
  if(!q) return;
  searchingEl.style.display = 'block';

  const providers = [searchUSDA, searchOFF];
  let results = [];
  for(const provider of providers){
    try{
      const r = await provider(q);
      if(r.length > 0){ results = r; break; }
    }catch(e){ /* this database failed or is unreachable — fall through to the next one */ }
  }

  searchingEl.style.display = 'none';

  if(results.length === 0){
    resultsEl.innerHTML = '<div class="searching">No matches across databases. ' +
      '<a href="https://www.google.com/search?q=' + encodeURIComponent(q + ' calories') +
      '" target="_blank" rel="noopener" style="color:var(--accent);">Search Google for &ldquo;' + escapeHtml(q) + '&rdquo; instead</a>, or try manual entry.</div>';
    return;
  }

  currentResults = results;
  resultsEl.innerHTML = results.slice(0,10).map((r, i) => `
    <div class="result" data-idx="${i}">
      <div class="rname">${escapeHtml(r.name)}</div>
      <div class="rkcal">${Math.round(r.kcalPerServing)} kcal ${r.unitLabel}</div>
    </div>
  `).join('');

  document.querySelectorAll('.result').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.getAttribute('data-idx'));
      showPortionPicker(currentResults[idx]);
    });
  });
}

function showPortionPicker(item){
  const picker = document.getElementById('portionPicker');
  picker.style.display = 'flex';
  const quickVals = [0.25, 0.5, 0.75, 1, 1.5, 2];
  picker.innerHTML = `
    <div class="ppname">${escapeHtml(item.name)}</div>
    <div class="ppbase">${Math.round(item.kcalPerServing)} kcal ${item.unitLabel} — how much did you have?</div>
    <div class="quick">
      ${quickVals.map(v => `<button data-v="${v}" class="${v === 1 ? 'active' : ''}">${v === 0.25 ? '¼' : v === 0.5 ? '½' : v === 0.75 ? '¾' : v}</button>`).join('')}
    </div>
    <div class="customrow">
      <input type="number" id="portionCustom" step="0.1" value="1" inputmode="decimal">
      <button id="confirmAddBtn">Add to log</button>
    </div>
    <button class="cancel" id="cancelPortionBtn">cancel</button>
  `;

  const customInput = document.getElementById('portionCustom');
  picker.querySelectorAll('.quick button').forEach(btn => {
    btn.addEventListener('click', () => {
      picker.querySelectorAll('.quick button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      customInput.value = btn.getAttribute('data-v');
    });
  });

  document.getElementById('confirmAddBtn').addEventListener('click', async () => {
    const portions = parseFloat(customInput.value);
    if(isNaN(portions) || portions <= 0) return;
    await addEntry(item.name, item.kcalPerServing, portions);
    picker.style.display = 'none';
    document.getElementById('results').innerHTML = '';
    document.getElementById('searchInput').value = '';
  });

  document.getElementById('cancelPortionBtn').addEventListener('click', () => {
    picker.style.display = 'none';
  });
}

document.getElementById('searchBtn').addEventListener('click', doSearch);
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') doSearch();
});

document.getElementById('toggleManual').addEventListener('click', () => {
  const row = document.getElementById('manualRow');
  row.style.display = row.style.display === 'none' ? 'flex' : 'none';
});

document.getElementById('manualAdd').addEventListener('click', async () => {
  const name = document.getElementById('manualName').value.trim();
  const kcal = parseFloat(document.getElementById('manualKcal').value);
  const portionsRaw = parseFloat(document.getElementById('manualPortions').value);
  const portions = isNaN(portionsRaw) || portionsRaw <= 0 ? 1 : portionsRaw;
  if(!name || isNaN(kcal)) return;
  await addEntry(name, kcal, portions);
  document.getElementById('manualName').value = '';
  document.getElementById('manualKcal').value = '';
  document.getElementById('manualPortions').value = '1';
});

document.getElementById('editGoalBtn').addEventListener('click', () => {
  const editEl = document.getElementById('goalEdit');
  document.getElementById('goalInput').value = goal;
  editEl.style.display = editEl.style.display === 'none' ? 'flex' : 'none';
});

document.getElementById('saveGoalBtn').addEventListener('click', async () => {
  const val = parseInt(document.getElementById('goalInput').value);
  if(!isNaN(val) && val > 0){
    await saveGoal(val);
    document.getElementById('goalEdit').style.display = 'none';
    render();
  }
});

document.getElementById('prevDay').addEventListener('click', async () => {
  currentOffset -= 1;
  await loadEntries();
  render();
});
document.getElementById('nextDay').addEventListener('click', async () => {
  currentOffset += 1;
  await loadEntries();
  render();
});

(async function init(){
  await loadGoal();
  await loadEntries();
  render();
})();
</script>
</body>
</html>
